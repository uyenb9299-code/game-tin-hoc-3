function optionPicture(s){var t=String(s).toLowerCase();var mapping=[['bàn phím','keyboard'],['chuột','mouse'],['màn hình','monitor'],['máy tính','computer'],['thư mục','folder'],['mật khẩu','lock'],['đèn giao thông','traffic'],['bộ não','brain'],['trời mưa','rain'],['áo mưa','rain'],['internet','internet'],['trang chiếu','slide'],['bướm','butterfly'],['hành tinh','planet'],['hình ảnh','picture'],['âm thanh','bell']];for(var i=0;i<mapping.length;i++)if(t.indexOf(mapping[i][0])>=0)return svg(mapping[i][1]);return '<svg viewBox="0 0 90 75"><rect x="9" y="8" width="72" height="59" rx="13" fill="#d6effa" stroke="#81bedb" stroke-width="3"/><circle cx="45" cy="37" r="16" fill="#ffcb70"/></svg>'}
function hud(){lvEl.textContent=(level+1)+'/8';lifeEl.textContent=lives+'/10';scoreEl.textContent=score}
function esc(s){return String(s).replace(/[&<>"']/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]})}
function intro(){playing=false;hud();main.innerHTML='<h1>GAME 2 - BÀI 9 ĐẾN 16</h1><div class="coverArt">'+svg('computer')+'</div><div class="sub">8 màn theo 8 bài SGK. Mỗi màn có 5 thử thách.<br>Trả lời đúng được 10 điểm. Sai mất 1 mạng. Hết mạng có thể chơi lại.</div><div class="menurow"><button class="btn green" id="start">BẮT ĐẦU CHƠI</button><button class="btn ghost" id="pick">XEM 8 MÀN</button></div><div class="help">Cần Internet để gửi kết quả về Google Sheets.<br>Nháy chuột, nháy đúp, kéo thả, gõ phím và chọn đáp án.</div>';document.getElementById('start').onclick=function(){level=0;task=0;lives=10;score=0;done=0;studentForm(show)};document.getElementById('pick').onclick=map;var go=document.createElement('a');go.href='../';go.className='btn ghost';go.textContent='QUAY VỀ GAME 1';main.querySelector('.menurow').appendChild(go)}
function map(){playing=false;hud();main.innerHTML='<h2>8 MÀN THÁM HIỂM</h2><div class="sub">Chọn một màn để luyện tập. Khi bắt đầu màn mới, em có 10 mạng.</div><div class="levelgrid">'+LEVELS.map(function(l,i){return '<button class="levelbtn '+(i<done?'done':i===done?'current':'')+'" data-i="'+i+'"><b>'+('0'+(i+1)).slice(-2)+'</b><span>'+esc(l.title)+'</span></button>'}).join('')+'</div><button class="btn ghost" id="home">VỀ TRANG CHỦ</button>';main.querySelectorAll('[data-i]').forEach(function(b){b.onclick=function(){level=Number(b.dataset.i);task=0;lives=10;score=0;if(!readyStudent())studentForm(show);else show()}});document.getElementById('home').onclick=intro}
function show(){if(lives<=0)return gameOver();if(level>=8)return win();playing=true;lock=false;hud();var l=LEVELS[level],q=l.tasks[task];main.innerHTML='<div class="leveltop">MÀN '+(level+1)+' / 16 - '+esc(l.book)+' - THỬ THÁCH '+(task+1)+'/5</div><h2>'+esc(l.title)+'</h2><div class="progress"><div class="bar" style="width:'+(((level*5+task)/40)*100)+'%"></div></div><div class="board"><div class="artpanel">'+svg(q.art)+'</div><div class="question"><div class="prompt">'+esc(q.prompt)+'</div><div id="answers"></div><div class="feedback" id="fb"></div></div></div><div class="menurow"><button class="btn ghost" id="menu">DANH SÁCH MÀN</button></div>';document.getElementById('menu').onclick=map;renderTask(q)}
function feedback(ok,msg){if(lock)return;lock=true;var f=document.getElementById('fb');if(!f)return;f.className='feedback '+(ok?'good':'bad');f.textContent=msg;if(ok){score+=10}else{lives--;if(lives<0)lives=0}hud();sendReport(ok,'Trả lời');setTimeout(function(){if(!playing)return;if(lives<=0){gameOver();return}if(ok){task++;if(task>=5){done=Math.max(done,level+1);level++;task=0;if(level>=8){win();return}levelIntro();return}}show()},ok?700:1100)}
function levelIntro(){playing=false;hud();var l=LEVELS[level];main.innerHTML='<div class="overlay"><h1>HOÀN THÀNH MÀN '+level+'</h1><div class="stars">* * *</div><p class="summary">Em đã vượt qua bài vừa rồi!<br>Điểm hiện tại: <b>'+score+'</b><br>Mạng còn lại: <b>'+lives+'</b></p><h2>Tiếp theo: '+esc(l.title)+'</h2><button class="btn green" id="next">CHƠI MÀN '+(level+1)+'</button></div>';document.getElementById('next').onclick=show}
function renderTask(q){var a=document.getElementById('answers');if(q.type==='choice'){a.className='options';a.innerHTML=q.opts.map(function(o,i){return '<button class="option" data-i="'+i+'"><span class="opart">'+optionPicture(o)+'</span><span class="optxt">'+String.fromCharCode(65+i)+'. '+esc(o)+'</span></button>'}).join('');a.querySelectorAll('button').forEach(function(b){b.onclick=function(){feedback(Number(b.dataset.i)===q.ans,Number(b.dataset.i)===q.ans?'Chính xác! +10 điểm':'Chưa đúng. Em mất 1 mạng. Hãy thử lại!')}})}
else if(q.type==='type'){a.innerHTML='<div class="actionzone"><input class="inputanswer" id="typed" maxlength="8" autocomplete="off" placeholder="GÕ Ở ĐÂY"><button class="btn" id="check">KIỂM TRA</button></div>';document.getElementById('check').onclick=function(){var val=document.getElementById('typed').value.toUpperCase().replace(/\s/g,'');feedback(val===q.ans,val===q.ans?'Gõ chính xác! +10 điểm':'Chưa đúng. Mất 1 mạng!')};document.getElementById('typed').onkeydown=function(e){if(e.key==='Enter')document.getElementById('check').click()};document.getElementById('typed').focus()}
else if(q.type==='mouseclick'||q.type==='double'){a.innerHTML='<div class="actionzone"><div class="target" id="target" title="Hãy thao tác chuột">'+svg(q.art)+'</div></div><div class="tiny">'+(q.type==='double'?'Nháy nhanh hai lần bằng nút trái chuột.':'Nháy một lần bằng nút trái chuột.')+'</div>';var target=document.getElementById('target');if(q.type==='mouseclick'){target.onclick=function(){feedback(true,'Nháy chuột đúng! +10 điểm')}}else{var n=0,t=0;target.onclick=function(e){var now=Date.now();if(now-t>550)n=0;n++;t=now;if(n>=2){n=0;feedback(true,'Nháy đúp chính xác! +10 điểm')}};target.oncontextmenu=function(e){e.preventDefault()}}}
else if(q.type==='drag'){a.innerHTML='<div class="actionzone"><div class="dragitem" draggable="true" id="dragitem">CHUỘT</div><div class="drop" id="drop">THẢ VÀO ĐÂY</div></div><div class="tiny">Giữ nút trái chuột, kéo thẻ sang khung bên phải rồi thả.</div>';var item=document.getElementById('dragitem'),drop=document.getElementById('drop');item.ondragstart=function(e){e.dataTransfer.setData('text/plain','CHUỘT')};drop.ondragover=function(e){e.preventDefault()};drop.ondrop=function(e){e.preventDefault();feedback(e.dataTransfer.getData('text/plain')==='CHUỘT','Kéo thả thành công! +10 điểm')};var sx,sy;item.onpointerdown=function(e){sx=e.clientX;sy=e.clientY};item.onpointerup=function(e){if(sx===undefined)return;var r=drop.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)feedback(true,'Kéo thả thành công! +10 điểm');sx=undefined}}
else if(q.type==='sort'){var pairs=q.opts,ix=0;a.innerHTML='<div class="sortwrap"><div class="dragitem" draggable="true" id="thing">'+esc(pairs[0][0])+'</div></div><div class="sortbins"><div class="bin" data-bin="Thiết bị máy tính"><strong>THIẾT BỊ MÁY TÍNH</strong><span id="b0"></span></div><div class="bin" data-bin="Thực phẩm"><strong>THỰC PHẨM</strong><span id="b1"></span></div></div><div class="tiny">Kéo thẻ vào đúng nhóm. Hoàn thành 4 thẻ để nhận điểm.</div>';var thing=document.getElementById('thing');function move(label){if(lock)return;if(label!==pairs[ix][1]){feedback(false,'Chưa đúng nhóm. Mất 1 mạng!');return}document.getElementById(label==='Thiết bị máy tính'?'b0':'b1').textContent+=' '+pairs[ix][0]+';';ix++;if(ix===pairs.length){feedback(true,'Phân loại đúng tất cả! +10 điểm');return}thing.textContent=pairs[ix][0]};thing.ondragstart=function(e){e.dataTransfer.setData('text/plain',thing.textContent)};a.querySelectorAll('.bin').forEach(function(bin){bin.ondragover=function(e){e.preventDefault()};bin.ondrop=function(e){e.preventDefault();move(bin.dataset.bin)};bin.onclick=function(){move(bin.dataset.bin)}})}
else if(q.type==='order'){var chosen=[];var items=q.opts.map(function(x,i){return {label:x,i:i}}).sort(function(a,b){return (a.i*7+3)%5-(b.i*7+3)%5});a.innerHTML='<div class="seq">'+items.map(function(x){return '<button data-i="'+x.i+'">'+esc(x.label)+'</button>'}).join('')+'</div><div class="tiny">Nháy các bước theo đúng thứ tự từ đầu đến cuối.</div>';a.querySelectorAll('.seq button').forEach(function(b){b.onclick=function(){if(lock||b.disabled)return;var v=Number(b.dataset.i);if(v!==chosen.length){feedback(false,'Sai thứ tự. Mất 1 mạng!');return}chosen.push(v);b.disabled=true;b.className='selected';b.textContent=(chosen.length)+'. '+b.textContent;if(chosen.length===q.opts.length)feedback(true,'Sắp xếp đúng thứ tự! +10 điểm')}})}
}
function gameOver(){playing=false;hud();sendReport(null,'Hết mạng');main.innerHTML='<div class="overlay"><h1>HẾT 10 MẠNG</h1><div class="coverArt" style="height:160px;margin:auto">'+svg('computer')+'</div><p class="summary">Em đã đến màn <b>'+(level+1)+'</b>.<br>Điểm đạt được: <b>'+score+'</b></p><div class="menurow"><button class="btn orange" id="retry">CHƠI LẠI MÀN NÀY</button><button class="btn ghost" id="home">TRANG CHỦ</button></div></div>';document.getElementById('retry').onclick=function(){lives=10;task=0;show()};document.getElementById('home').onclick=intro}
function win(){playing=false;done=8;hud();sendReport(null,'Hoàn thành game');main.innerHTML='<div class="overlay"><h1>CHÚC MỪNG NHÀ THÁM HIỂM!</h1><div class="coverArt" style="height:160px;margin:auto">'+svg('planet')+'</div><p class="summary">Em đã hoàn thành <b>8 màn - 40 thử thách</b>!<br>Tổng điểm: <b>'+score+'</b><br>Số mạng còn lại: <b>'+lives+'</b></p><div class="menurow"><button class="btn green" id="again">CHƠI LẠI TỪ ĐẦU</button><button class="btn ghost" id="map">CHỌN MÀN</button></div></div>';document.getElementById('again').onclick=function(){level=0;task=0;lives=10;score=0;done=0;show()};document.getElementById('map').onclick=map;var go=document.createElement('a');go.href='../';go.className='btn ghost';go.textContent='QUAY VỀ GAME 1';main.querySelector('.menurow').appendChild(go)}
intro();
</script></body></html>
